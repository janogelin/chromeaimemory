<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chrome AI Memory</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Chrome AI Memory</h1>
      <p class="sub">Local hybrid memory for Claude.ai</p>
    </header>

    <section id="status" class="card">
      <div class="row"><span>Claude</span><strong id="auth">…</strong></div>
      <div class="row"><span>Auto-memory</span><strong id="auto">…</strong></div>
      <div class="row"><span>Memories</span><strong id="count">0</strong></div>
    </section>

    <section id="consent-gate" class="card hidden">
      <p>
        Auto-memory reads conversation text on <strong>claude.ai</strong> to
        extract durable facts and injects a relevance pack into the composer.
        Data stays on this device. You can Pause or wipe anytime.
      </p>
      <button id="btn-consent" type="button">Enable Auto-memory</button>
    </section>

    <section class="actions">
      <button id="btn-pause" type="button" class="secondary">Pause</button>
      <button id="btn-sidepanel" type="button">Open pack panel</button>
    </section>

    <p id="hint" class="hint"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
